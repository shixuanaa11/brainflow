<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainFlow 智脑流</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f0f2f5; color: #333; }
  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header span { opacity: 0.7; font-size: 13px; }
  .container { max-width: 1200px; margin: 20px auto; padding: 0 24px; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab { padding: 8px 24px; background: white; border: 1px solid #ddd;
         border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; }
  .tab.active { background: #16213e; color: white; border-color: #16213e; }
  .panel { background: white; border-radius: 0 12px 12px 12px; padding: 20px;
           box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-height: 480px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .card { padding: 16px; border-radius: 10px; background: #f8f9fc; }
  .card h3 { font-size: 12px; color: #888; margin-bottom: 6px; }
  .card .v { font-size: 28px; font-weight: 700; color: #16213e; }
  /* 对话 */
  #chat-box { height: 380px; overflow-y: auto; border: 1px solid #eee;
              border-radius: 10px; padding: 14px; margin-bottom: 12px; background: #fafbfc; }
  .msg { margin-bottom: 10px; display: flex; }
  .msg .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: #16213e; color: white; }
  .msg.ai .bubble { background: white; border: 1px solid #e5e7eb; }
  .msg .meta { font-size: 11px; color: #999; margin-top: 4px; }
  #chat-input { width: calc(100% - 90px); padding: 10px 14px; border: 1px solid #ddd;
                border-radius: 8px; font-size: 14px; }
  #chat-send { width: 80px; padding: 10px; background: #16213e; color: white;
               border: none; border-radius: 8px; cursor: pointer; }
  /* 图 */
  .graph-select { padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 14px; }
  #graph-box { border: 1px solid #eee; border-radius: 10px; padding: 16px; overflow-x: auto; }
  /* 看板 */
  .tool-row { display: flex; justify-content: space-between; padding: 8px 0;
              border-bottom: 1px solid #f5f5f5; font-size: 13px; }
  .log-list { max-height: 320px; overflow-y: auto; }
  .log-entry { padding: 6px 10px; border-left: 3px solid #16213e; margin-bottom: 6px;
               background: #f8f9fc; border-radius: 0 6px 6px 0; font-size: 12px; }
  .log-entry.error { border-left-color: #e74c3c; }
  /* 任务节点观测 */
  .task-item { border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; background: #fafbfc; }
  .task-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px;
               cursor: pointer; font-size: 13px; flex-wrap: wrap; }
  .task-meta { margin-left: auto; color: #999; font-size: 11px; }
  .task-spans { padding: 0 12px 10px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
           background: #e8f5e9; color: #2e7d32; }
  .badge.error { background: #fdecea; color: #c62828; }
  .span-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .span-table th, .span-table td { border: 1px solid #eee; padding: 6px 8px;
                                   text-align: left; vertical-align: top; }
  .span-table th { background: #f0f2f5; }
  .span-table .io { max-width: 220px; word-break: break-all; color: #555; }
  .err { color: #c62828; }
</style>
</head>
<body>
<div class="header">
  <h1>🧠 BrainFlow 智脑流</h1>
  <span>一站式企业级任务分配工作流智能助手</span>
</div>
<div class="container">
  <div class="tab-bar">
    <div class="tab active" data-tab="chat">对话</div>
    <div class="tab" data-tab="graphs">工作流图</div>
    <div class="tab" data-tab="board">看板</div>
  </div>

  <!-- 对话 -->
  <div class="panel" id="panel-chat">
    <div id="chat-box"></div>
    <input id="chat-input" placeholder="输入消息，例如：深圳今天天气怎么样" onkeydown="if(event.key==='Enter')sendChat()">
    <button id="chat-send" onclick="sendChat()">发送</button>
  </div>

  <!-- 工作流图 -->
  <div class="panel" id="panel-graphs" style="display:none">
    <select id="graph-select" class="graph-select" onchange="loadGraph()"></select>
    <div id="graph-box">加载中...</div>
  </div>

  <!-- 看板 -->
  <div class="panel" id="panel-board" style="display:none">
    <div class="grid" style="margin-bottom:16px">
      <div class="card"><h3>总调用</h3><div class="v" id="k-calls">--</div></div>
      <div class="card"><h3>Token</h3><div class="v" id="k-tokens">--</div></div>
      <div class="card"><h3>错误</h3><div class="v" id="k-errors">--</div></div>
      <div class="card"><h3>工具数</h3><div class="v" id="k-tools">--</div></div>
    </div>
    <h3 style="margin-bottom:8px">工具分布</h3>
    <div id="tool-list">加载中...</div>
    <h3 style="margin:16px 0 8px">最近任务（节点级观测）</h3>
    <div id="task-list">加载中...</div>
    <h3 style="margin:16px 0 8px">最近日志</h3>
    <div class="log-list" id="log-list">加载中...</div>
  </div>
</div>

<script>
// 标签页切换
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    document.getElementById('panel-' + t.dataset.tab).style.display = 'block';
    if (t.dataset.tab === 'graphs') loadGraphs();
    if (t.dataset.tab === 'board') loadBoard();
  });
});

// 对话（SSE 流式）
async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const box = document.getElementById('chat-box');
  box.innerHTML += `<div class="msg user"><div><div class="bubble">${escapeHtml(text)}</div></div></div>`;
  const aiDiv = document.createElement('div');
  aiDiv.className = 'msg ai';
  aiDiv.innerHTML = `<div><div class="bubble"></div><div class="meta">⏱ 流式...</div></div>`;
  box.appendChild(aiDiv);
  const bubble = aiDiv.querySelector('.bubble');
  const meta = aiDiv.querySelector('.meta');
  const t0 = Date.now();
  let reply = '';
  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, user_id: 'web'})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        const payload = JSON.parse(line.replace(/^data: /, ''));
        if (payload.type === 'reply') {
          reply += payload.reply;
          bubble.innerHTML = escapeHtml(reply).replace(/\n/g, '<br>');
          box.scrollTop = box.scrollHeight;
        } else if (payload.type === 'error') {
          reply += `\n[错误] ${payload.message}`;
          bubble.innerHTML = escapeHtml(reply).replace(/\n/g, '<br>');
        } else if (payload.type === 'node' && payload.node === 'summary') {
          meta.textContent = '⏱ 总结中...';
        }
      }
    }
  } catch (e) {
    bubble.innerHTML = `请求失败: ${e}`;
  }
  meta.textContent = `⏱ ${Date.now() - t0}ms`;
  box.scrollTop = box.scrollHeight;
}

// 工作流图（draw_mermaid + mermaid.js）
async function loadGraphs() {
  const sel = document.getElementById('graph-select');
  const resp = await fetch('/api/graphs');
  const data = await resp.json();
  sel.innerHTML = `<option value="${data.id}">${data.id}</option>`;
  renderMermaid(data.mermaid);
}

function renderMermaid(mermaidText) {
  const box = document.getElementById('graph-box');
  box.innerHTML = `<div class="mermaid">${mermaidText}</div>`;
  mermaid.run();
}

// 看板
async function loadBoard() {
  const r1 = await fetch('/api/board').then(r => r.json());
  document.getElementById('k-calls').textContent = r1.total_calls || 0;
  document.getElementById('k-tokens').textContent = r1.total_tokens || 0;
  document.getElementById('k-errors').textContent = r1.total_errors || 0;
  document.getElementById('k-tools').textContent = r1.active_tools || 0;

  const r2 = await fetch('/api/profiles').then(r => r.json());
  document.getElementById('tool-list').innerHTML = (r2.profiles || []).map(p =>
    `<div class="tool-row"><span>${p.tool}</span><span>${p.calls} 次 · ${p.tokens} tokens</span></div>`).join('') || '暂无数据';

  const r3 = await fetch('/api/logs?n=20').then(r => r.json());
  document.getElementById('log-list').innerHTML = (r3.logs || []).map(l =>
    `<div class="log-entry${l.error ? ' error' : ''}">[${l.tool}] ${l.error || 'ok'} · ${l.tokens||0}t · ${new Date(l.time*1000).toLocaleTimeString()}</div>`).join('') || '暂无日志';

  // 最近任务 + 节点级详情（状态/耗时/输入/输出/token）
  const r4 = await fetch('/api/tasks').then(r => r.json());
  const tasks = r4.tasks || [];
  document.getElementById('task-list').innerHTML = tasks.length
    ? tasks.map((t, i) => `
      <div class="task-item" onclick="toggleTask(this)">
        <div class="task-head">
          <span class="badge ${t.status}">${t.status}</span>
          <span><b>${escapeHtml(t.workflow)}</b> · ${escapeHtml((t.input||'').slice(0,30))}</span>
          <span class="task-meta">${(t.spans||[]).length} 节点 · ${new Date(t.timestamp*1000).toLocaleTimeString()}</span>
        </div>
        <div class="task-spans" style="display:none">${renderSpans(t.spans||[])}</div>
      </div>`).join('')
    : '<div class="log-entry">暂无任务</div>';
}

function toggleTask(el) {
  const spans = el.querySelector('.task-spans');
  spans.style.display = spans.style.display === 'none' ? 'block' : 'none';
}

function renderSpans(spans) {
  if (!spans.length) return '<div class="log-entry">无节点记录</div>';
  return '<table class="span-table"><tr><th>节点</th><th>状态</th><th>耗时</th><th>Token</th><th>输入</th><th>输出</th></tr>' +
    spans.map(s => `
      <tr>
        <td><b>${escapeHtml(s.node)}</b><br><small>${s.kind}</small></td>
        <td><span class="badge ${s.status}">${s.status}</span>${s.detail ? `<br><small class="err">${escapeHtml(s.detail)}</small>` : ''}</td>
        <td>${(s.duration*1000).toFixed(0)} ms</td>
        <td>${s.tokens || 0}</td>
        <td class="io">${escapeHtml((s.input||'').slice(0,80))}</td>
        <td class="io">${escapeHtml((s.output||'').slice(0,80))}</td>
      </tr>`).join('') + '</table>';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 初始：渲染图 + 看板
loadGraphs();
loadBoard();
</script>
</body>
</html>
