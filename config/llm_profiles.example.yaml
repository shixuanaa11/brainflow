# LLM 模型 Profiles 配置（对齐工匠社 GJS 规范）
# ================================================================
# 复制为 llm_profiles.yaml 并填入各模型的 api_key / base_url
# 切换模型：只改 .env 的 LLM_MODEL=<profile 名>
# 读取：from config.settings import LLM_PROFILES, get_llm_profile
# ================================================================

